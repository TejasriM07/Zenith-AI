<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith AI | Manager - Employee Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #f3e7ff 0%, #e5d9f2 50%, #d7c1f9 100%); color: #2b2d42; min-height: 100vh; }
        .clay-card { background: #ffffff; border-radius: 35px; box-shadow: 20px 20px 50px rgba(163, 140, 195, 0.4); }
        .clay-button-primary { background: #7c3aed; color: #ffffff; border-radius: 20px; box-shadow: 10px 10px 25px rgba(124, 58, 237, 0.4); }
        .clay-nav { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-radius: 25px; }
    </style>
</head>
<body class="flex flex-col justify-between p-6 md:p-10">

    <header class="clay-nav flex items-center justify-between px-10 py-5 max-w-7xl mx-auto w-full sticky top-4 z-50">
        <a href="index.html" class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-bold text-white text-xl shadow-md">Z</div>
            <span class="text-xl font-bold text-purple-950">ZENITH AI <span class="text-xs bg-purple-200 text-purple-800 px-3 py-1 rounded-full ml-2">Manager Performance</span></span>
        </a>
        <div class="flex items-center space-x-4">
            <a href="dashboard.html" class="text-xs font-bold bg-purple-100 text-purple-700 px-4 py-2.5 rounded-xl">Command Center</a>
            <a href="manager-portal.html" class="text-xs font-bold bg-purple-100 text-purple-700 px-4 py-2.5 rounded-xl">Employee Oversight</a>
            <button onclick="logout()" class="text-xs font-bold text-red-600 bg-white px-4 py-3 rounded-2xl shadow-sm">Sign Out</button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full my-10 space-y-8">
        <div class="clay-card p-8 md:p-12">
            <h1 class="text-2xl md:text-3xl font-extrabold text-purple-950 mb-2">Employee Resolution Analytics</h1>
            <p class="text-sm text-purple-900/70 mb-8">Review how many support tickets each staff member has successfully resolved.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-10" id="performanceCardsContainer">
                <!-- Dynamically populated employee stat cards -->
            </div>

            <!-- Detailed Modal / Section for Viewed Employee -->
            <div id="detailSection" class="hidden bg-purple-50/60 p-6 rounded-3xl border border-purple-200">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="detailTitle" class="text-lg font-bold text-purple-950"></h3>
                    <button onclick="closeDetails()" class="text-xs bg-white px-3 py-1.5 rounded-xl font-bold text-purple-700 shadow-sm">Close</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b border-purple-200 text-xs font-bold uppercase text-purple-900">
                                <th class="p-3">Ticket ID</th>
                                <th class="p-3">Client Email</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Summary</th>
                            </tr>
                        </thead>
                        <tbody id="detailTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'ROLE_MANAGER') {
            alert('Unauthorized Access'); window.location.href = 'login.html';
        }

        async function loadPerformance() {
            const [usersRes, ticketsRes] = await Promise.all([
                fetch('http://localhost:8050/api/auth/users'),
                fetch('http://localhost:8050/api/tickets')
            ]);
            const users = await usersRes.json();
            const tickets = await ticketsRes.json();

            const staff = users.filter(u => u.role === 'ROLE_AGENT' || u.role === 'ROLE_MANAGER');
            const container = document.getElementById('performanceCardsContainer');
            container.innerHTML = '';

            staff.forEach(emp => {
                const resolvedTickets = tickets.filter(t => t.resolvedBy === emp.name || t.resolvedBy === emp.email);
                container.innerHTML += `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-purple-100 flex flex-col justify-between">
                        <div>
                            <span class="text-xs font-bold text-purple-600 bg-purple-100 px-3 py-1 rounded-full">${emp.role}</span>
                            <h3 class="text-lg font-extrabold text-purple-950 mt-3">${emp.name}</h3>
                            <p class="text-xs text-purple-900/70 mb-4">${emp.email}</p>
                            <div class="text-2xl font-black text-purple-700 mb-2">${resolvedTickets.length} <span class="text-xs font-semibold text-purple-900/60">Resolved Tickets</span></div>
                        </div>
                        <button onclick='viewDetails(${JSON.stringify(emp.name)}, ${JSON.stringify(resolvedTickets)})' 
                                class="mt-4 w-full py-2.5 clay-button-primary text-xs font-bold">
                            View More Details
                        </button>
                    </div>
                `;
            });
        }

        function viewDetails(empName, tickets) {
            document.getElementById('detailTitle').textContent = `Resolved Tickets Handled by ${empName}`;
            const tbody = document.getElementById('detailTableBody');
            tbody.innerHTML = '';
            if (tickets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-purple-400">No tickets resolved by this agent yet.</td></tr>`;
            } else {
                tickets.forEach(t => {
                    tbody.innerHTML += `
                        <tr class="border-b border-purple-100">
                            <td class="p-3 font-bold">#${t.id}</td>
                            <td class="p-3">${t.customerEmail}</td>
                            <td class="p-3"><span class="px-2 py-0.5 bg-purple-100 text-purple-800 rounded text-xs font-bold">${t.category}</span></td>
                            <td class="p-3 text-xs text-purple-900/80">${t.aiSummary || t.rawMessage}</td>
                        </tr>
                    `;
                });
            }
            document.getElementById('detailSection').classList.remove('hidden');
        }

        function closeDetails() { document.getElementById('detailSection').classList.add('hidden'); }

        loadPerformance();
        function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }
    </script>
</body>
</html>
