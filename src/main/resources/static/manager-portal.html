<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith AI | Manager Portal - Employee Oversight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #f3e7ff 0%, #e5d9f2 50%, #d7c1f9 100%); color: #2b2d42; min-height: 100vh; }
        .clay-card { background: #ffffff; border-radius: 35px; box-shadow: 20px 20px 50px rgba(163, 140, 195, 0.4); }
        .clay-button-primary { background: #7c3aed; color: #ffffff; border-radius: 20px; box-shadow: 10px 10px 25px rgba(124, 58, 237, 0.4); }
        .clay-nav { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-radius: 25px; }
    </style>
</head>
<body class="flex flex-col justify-between p-6 md:p-10">

   <!-- Clay Navigation Bar with Increased Padding & Clickable Brand Logo -->
    <header class="clay-nav flex items-center justify-between px-10 py-5 max-w-7xl mx-auto w-full sticky top-4 z-50">
        <a href="index.html" class="flex items-center space-x-3 group cursor-pointer">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-bold text-white text-xl shadow-md group-hover:scale-105 transition">Z</div>
            <span class="text-xl font-bold tracking-wider text-purple-950">ZENITH AI <span id="portalBadge" class="text-xs bg-purple-200 text-purple-800 px-3 py-1 rounded-full ml-2 font-semibold">Portal</span></span>
        </a>
        <div class="flex items-center space-x-4">
            <div id="managerNavContainer"></div>
            <a href="register-agent.html" class="text-xs font-bold clay-button-secondary px-5 py-3 flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                <span>Add Agent</span>
            </a>
            <span id="agentNameDisplay" class="text-sm font-semibold text-purple-900 hidden md:inline px-2"></span>
            <button onclick="logout()" class="text-xs font-bold text-red-600 bg-white px-4 py-3 rounded-2xl shadow-sm hover:bg-red-50">Sign Out</button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full my-10">
        <div class="clay-card p-8 md:p-12">
            <h1 class="text-2xl md:text-3xl font-extrabold text-purple-950 mb-2">Customer Service Representatives Oversight</h1>
            <p class="text-sm text-purple-900/70 mb-8">Manage staff accounts, review who registered each employee, and control access permissions.</p>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-purple-200 text-xs font-bold uppercase tracking-wider text-purple-900">
                            <th class="p-4">Name</th>
                            <th class="p-4">Email</th>
                            <th class="p-4">Role</th>
                            <th class="p-4">Registered By</th>
                            <th class="p-4">Access Status</th>
                            <th class="p-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody" class="text-sm text-purple-950 divide-y divide-purple-100">
                        <tr><td colspan="6" class="p-6 text-center text-purple-400">Loading staff details...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'ROLE_MANAGER') {
            alert('Restricted Access: Manager privileges required.');
            window.location.href = 'login.html';
        }

        async function loadEmployees() {
            try {
                const res = await fetch('http://localhost:8050/api/auth/users');
                const users = await res.json();
                const tbody = document.getElementById('employeeTableBody');
                tbody.innerHTML = '';

                // Filter only agents/managers
                const staff = users.filter(u => u.role === 'ROLE_AGENT' || u.role === 'ROLE_MANAGER');
                
                staff.forEach(emp => {
                    const statusBadge = emp.accessGranted 
                        ? `<span class="px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700">Granted</span>`
                        : `<span class="px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700">Pending Approval</span>`;
                    
                    const actionBtn = emp.role === 'ROLE_MANAGER' ? `<span class="text-xs text-slate-400">Master Account</span>` :
                        emp.accessGranted 
                            ? `<button onclick="toggleAccess(${emp.id})" class="px-3 py-1.5 bg-red-500 text-white rounded-xl text-xs font-bold shadow-md">Remove Access</button>`
                            : `<button onclick="toggleAccess(${emp.id})" class="px-3 py-1.5 bg-green-600 text-white rounded-xl text-xs font-bold shadow-md">Grant Access</button>`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-white/40">
                            <td class="p-4 font-bold">${emp.name}</td>
                            <td class="p-4 font-medium">${emp.email}</td>
                            <td class="p-4 font-semibold text-purple-700">${emp.role}</td>
                            <td class="p-4 text-xs text-purple-900/80">${emp.registeredBy || 'System Seed'}</td>
                            <td class="p-4">${statusBadge}</td>
                            <td class="p-4">${actionBtn}</td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        async function toggleAccess(id) {
            await fetch(`http://localhost:8050/api/auth/toggle-access/${id}`, { method: 'POST' });
            loadEmployees();
        }

        loadEmployees();
        function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }
    </script>
</body>
</html>
